<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07382c"><title>InfoBot AI Mobile</title><link rel="stylesheet" href="styles.css"></head><body><main class="kiosk" style="max-width:760px"><header class="top glass"><div class="brand"><img src="assets/st-jude-logo.png" alt="St. Jude College logo"><div><b>St. Jude College</b><span>Dasmariñas, Cavite</span><small>InfoBot AI Mobile Handoff</small></div></div><div class="status"><i></i> Mobile Guide</div></header><section class="glass" style="margin-top:14px;padding:28px;border-radius:26px" id="content"></section></main><script>const id=new URLSearchParams(location.search).get('room')||'registrar';const r=rooms.find(x=>x.id===id)||rooms[0];document.querySelector('#content').innerHTML=`<span class="eyebrow">MOBILE CAMPUS GUIDE</span><h1 style="font-size:38px;margin:10px 0">${r.name}</h1><p style="color:var(--muted);line-height:1.7"><b>${r.location}</b><br>${r.floor} Floor<br><br><b>Operating Hours</b><br>${r.hours}<br><br><b>Services</b><br>${r.services}<br><br><b>Contact</b><br>${r.contact}</p><div class="card-actions"><button class="primary" onclick="history.back()">← Back</button><button onclick="alert('Prototype directions: follow the campus map signage to '+r.location)">↗ Directions</button></div>`;</script></body></html>
